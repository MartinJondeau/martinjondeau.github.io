<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeks : Master Finance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #D4AF37; /* Or Greeks */

            color: #a0a0a0;
            max-width: 600px;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #D4AF37;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .cta-button:hover {
            transform: scale(1.05);
            background-color: #f1c40f;
        }

        footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.9rem;
        }

        footer a {
            color: #D4AF37;
            text-decoration: none;
            margin: 0 10px;
